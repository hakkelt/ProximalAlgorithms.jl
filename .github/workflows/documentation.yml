name: Documentation

on:
  push:
    branches:
      - master
      - integration
    tags: '*'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v2
      - uses: julia-actions/setup-julia@latest
        with:
          version: '1'
      # `integration` needs versions of the sibling forks that are not registered yet.
      - name: Use the sibling forks' integration branches
        if: github.ref_name == 'integration'
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.Registry.add("General")
          forks = [
                ("OperatorCore", "OperatorCore.jl", nothing),
                ("ProximalOperators", "ProximalOperators.jl", nothing),
          ]
          own = Pkg.TOML.parsefile("Project.toml")["name"]
          for env in (".", "docs")
              Pkg.activate(env)
              env == "docs" && own in keys(Pkg.project().dependencies) && Pkg.rm(own)
              deps = keys(Pkg.project().dependencies)
              foreach(f -> f[1] in deps && Pkg.compat(f[1], nothing), forks)
              Pkg.add([PackageSpec(; url = "https://github.com/hakkelt/" * repo, rev = "integration", subdir) for (_, repo, subdir) in forks])
          end
      - name: Install dependencies
        run: julia --project=docs/ -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # If authenticating with GitHub Actions token
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }} # If authenticating with SSH deploy key
          DOCUMENTER_DEVBRANCH: ${{ github.ref_name == 'integration' && 'integration' || 'master' }}
          DOCUMENTER_WARNONLY: ${{ github.ref_name == 'integration' && 'missing_docs,cross_references,doctest' || '' }}
        run: julia --project=docs/ docs/make.jl
